<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="0.75" stop-color="#FF4D8D"/>
      <stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="40" y="11" width="1120" height="2" rx="1" fill="url(#line)" opacity="0.8"/>
  <circle cy="12" r="11" fill="url(#dot)">
    <animate attributeName="cx" values="60;1140;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="12" r="4" fill="#E8C77B">
    <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
