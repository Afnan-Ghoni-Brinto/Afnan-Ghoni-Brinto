<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" aria-label="GitHub statistics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#111B2E"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#00D9FF"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="418" height="234" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="28" y="1" width="64" height="4" rx="2" fill="url(#acc)"/>
  <text x="28" y="46" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#00D9FF">GitHub Stats</text>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.000;1" dur="0.60s" begin="0s" fill="freeze"/>
    <circle cx="36" cy="83" r="5" fill="#E8C77B"/>
    <text x="52" y="88" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C9D1D9">Total Stars Earned</text>
    <text x="268" y="88" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3">1</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.167;1" dur="0.72s" begin="0s" fill="freeze"/>
    <circle cx="36" cy="113" r="5" fill="#00D9FF"/>
    <text x="52" y="118" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C9D1D9">Commits (last year)</text>
    <text x="268" y="118" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3">125</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.286;1" dur="0.84s" begin="0s" fill="freeze"/>
    <circle cx="36" cy="143" r="5" fill="#8B5CF6"/>
    <text x="52" y="148" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C9D1D9">Pull Requests</text>
    <text x="268" y="148" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3">0</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.375;1" dur="0.96s" begin="0s" fill="freeze"/>
    <circle cx="36" cy="173" r="5" fill="#FF4D8D"/>
    <text x="52" y="178" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C9D1D9">Issues Opened</text>
    <text x="268" y="178" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3">1</text>
  </g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.444;1" dur="1.08s" begin="0s" fill="freeze"/>
    <circle cx="36" cy="203" r="5" fill="#27C93F"/>
    <text x="52" y="208" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#C9D1D9">Contributed to (last year)</text>
    <text x="268" y="208" text-anchor="end" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3">26</text>
  </g>
  <g transform="rotate(-90 342 134)">
    <circle cx="342" cy="134" r="46" fill="none" stroke="#1F2937" stroke-width="10"/>
    <circle cx="342" cy="134" r="46" fill="none" stroke="url(#acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="289.0" stroke-dashoffset="153.5">
      <animate attributeName="stroke-dashoffset" from="289.0" to="153.5" dur="1.4s" fill="freeze"/>
    </circle>
  </g>
  <text x="342" y="146" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#E8C77B">B+</text>
  <text x="342" y="166" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2" fill="#8B949E">RANK</text>
</svg>
